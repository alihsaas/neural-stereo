[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neural-stereo"
version = "0.1.0"
description = "A measured study of JPEG compression against stereo depth accuracy on Middlebury 2014 scenes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "opencv-python>=4.10,<5", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
neural = ["torch==2.9.1", "flexglue"]

[tool.uv]
exclude-newer = "2026-10-26T22:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch" }
flexglue = { git = "https://github.com/cvg/FlexGlue.git", tag = "v0.1" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_stereo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".runtime", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
